<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Deepavali surprise</title>
<style>
  :root {
    --night: #1a0d2e;
    --night-2: #2b1247;
    --marigold: #f5a623;
    --flame: #ffd36b;
    --rani: #d6336c;
    --clay: #b5532a;
    --cream: #fff4dc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 120%, var(--night-2), var(--night) 65%);
    color: var(--cream);
    font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    overflow-x: hidden;
    min-height: 100dvh;
  }
  canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

  main { position: relative; z-index: 2; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 20px 48px; text-align: center; }

  .intro h1 { font-size: clamp(1.7rem, 7vw, 2.6rem); font-weight: 400; line-height: 1.25; max-width: 18ch; margin: 0 auto 10px; }
  .intro p { color: #e8cfa0; font-size: 1.05rem; max-width: 30ch; margin: 0 auto; line-height: 1.5; }

  /* Diyas */
  .row { display: flex; gap: clamp(10px, 4vw, 26px); justify-content: center; margin: 46px 0 28px; }
  .diya { position: relative; width: clamp(48px, 14vw, 74px); height: clamp(70px, 20vw, 104px); background: none; border: 0; cursor: pointer; display: flex; align-items: flex-end; justify-content: center; -webkit-tap-highlight-color: transparent; }
  .diya:focus-visible { outline: 3px solid var(--flame); outline-offset: 6px; border-radius: 12px; }
  .bowl {
    width: 100%; height: 44%;
    background: linear-gradient(180deg, #d0693a, var(--clay) 60%, #7e3515);
    border-radius: 6px 6px 100px 100px / 6px 6px 100% 100%;
    position: relative;
    box-shadow: inset 0 3px 0 rgba(255,255,255,.18);
  }
  .bowl::before { /* spout */
    content: ""; position: absolute; right: -14%; top: -6%; width: 26%; height: 34%;
    background: var(--clay); border-radius: 0 100% 0 0; transform: rotate(8deg);
  }
  .wick { position: absolute; left: 50%; bottom: 40%; width: 3px; height: 10px; background: #2a1409; transform: translateX(-50%); border-radius: 2px; }
  .flame {
    position: absolute; left: 50%; bottom: 44%; width: 38%; height: 46%;
    transform: translateX(-50%) scale(0); transform-origin: 50% 100%;
    background: radial-gradient(ellipse at 50% 75%, #fff 0%, var(--flame) 35%, var(--marigold) 70%, rgba(245,166,35,0) 100%);
    border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
    filter: blur(.4px);
    transition: transform .5s cubic-bezier(.2,1.4,.4,1);
  }
  .diya.lit .flame { transform: translateX(-50%) scale(1); animation: flicker 1.3s ease-in-out infinite .5s; }
  .glow {
    position: absolute; left: 50%; bottom: 20%; width: 260%; aspect-ratio: 1; transform: translateX(-50%) scale(0);
    background: radial-gradient(circle, rgba(255,190,70,.38), rgba(255,190,70,0) 62%);
    border-radius: 50%; pointer-events: none; transition: transform .8s ease;
  }
  .diya.lit .glow { transform: translateX(-50%) scale(1); }
  .diya:not(.lit) .bowl { animation: nudge 2.4s ease-in-out infinite; }

  @keyframes flicker {
    0%,100% { transform: translateX(-50%) scale(1) rotate(-1.5deg); }
    35% { transform: translateX(-50%) scale(1.07, .95) rotate(2deg); }
    65% { transform: translateX(-50%) scale(.95, 1.06) rotate(-2deg); }
  }
  @keyframes nudge { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-4px);} }

  .hint { color: #e8cfa0; font-size: 1rem; min-height: 1.5em; transition: opacity .4s; }

  /* Message card */
  .card { display: none; width: min(92vw, 440px); margin-top: 6px; padding: 30px 24px 26px;
    background: linear-gradient(160deg, rgba(255,244,220,.10), rgba(255,244,220,.04));
    border: 1px solid rgba(245,166,35,.55); border-radius: 22px 22px 6px 22px;
    text-align: left; }
  .card.show { display: block; animation: rise .9s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px);} to { opacity: 1; transform: none;} }
  .card h2 { font-size: clamp(1.6rem, 7vw, 2.1rem); font-weight: 400; color: var(--flame); margin-bottom: 14px; line-height: 1.2; }
  .card p { font-size: 1.08rem; line-height: 1.65; margin-bottom: 12px; color: var(--cream); }
  .sign { margin-top: 18px; color: var(--flame); font-style: italic; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
  .btn { font: inherit; font-size: .98rem; padding: 12px 18px; border-radius: 999px; border: 1px solid var(--marigold); background: var(--marigold); color: #2b1247; cursor: pointer; text-decoration: none; }
  .btn.ghost { background: transparent; color: var(--cream); }
  .btn:focus-visible { outline: 3px solid var(--flame); outline-offset: 3px; }

  .tmpl { position: fixed; bottom: 10px; left: 0; right: 0; z-index: 6; display: flex; justify-content: center; gap: 8px; opacity: .0; transition: opacity .3s; }
  .tmpl.on { opacity: .85; }
  .tmpl button { font: inherit; font-size: .85rem; padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(255,244,220,.4); background: rgba(26,13,46,.8); color: var(--cream); }
  .tmpl button[aria-pressed="true"] { background: var(--rani); border-color: var(--rani); }

  @media (prefers-reduced-motion: reduce) {
    .diya.lit .flame, .diya:not(.lit) .bowl, .card.show { animation: none; }
  }
</style>
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>

<main>
  <section class="intro" id="intro">
    <h1 id="introTitle">Something small for you</h1>
    <p>Light each diya to unlock your surprise.</p>
  </section>

  <div class="row" id="row" role="group" aria-label="Diyas to light"></div>
  <p class="hint" id="hint">Tap a diya. 0 of 5 lit.</p>

  <article class="card" id="card" aria-live="polite">
    <h2 id="cardTitle"></h2>
    <div id="cardBody"></div>
    <p class="sign" id="sign"></p>
    <div class="actions">
      <a class="btn" id="reply" target="_blank" rel="noopener">Send wishes back</a>
      <button class="btn ghost" id="again" type="button">More fireworks</button>
    </div>
  </article>
</main>

<div class="tmpl" id="tmpl" aria-label="Message style"></div>

<script>
/* =====================================================
   1. EDIT THIS PART
   Or share a link like: diwali-surprise.html?to=Priya&from=Rahul&t=funny
   ===================================================== */
const CONFIG = {
  to:   "special one ",         // her name
  from: "purshuuu ",       // your name
  template: "heartfelt",  // "heartfelt" | "funny" | "short"
  diyaCount: 5
};

/* Message templates. {to} and {from} are filled in automatically. */
const TEMPLATES = {
  heartfelt: {
    label: "Heartfelt",
    title: "Happy deepavali, {to}!",
    lines: [
      "prati varshadante hachhuva deepagalu ondu belaku sanna idi room anne hege belakagisuttadeyo ninu  haage nanna jeevanadalliyu haageye eddiya avaga dinavidi matanadida aa matugalu mattu yavagalu nanna jote nillu tidda ninna matugalu hagu kelavonda sala este kastagaliddaru ninna jote matanadida takshana adell maredu mugulnge kottiddu  matte ede tara ninu yavagalu hige ertiya antanu gottu  adaru ninangu ninna kutumbadavarigu deepavali habbada hardika shubhashayagalu to my dearest special one 🖤."
    ]
  },
  funny: {
    label: "Funny",
    title: "Happy deepavali, {to}!",
    lines: [
      "Official notice: you are hereby entitled to unlimited sweets, zero guilt, and one friend who will eat the last ladoo for you.",
      "Please do not light any firework that you cannot outrun. I cannot afford to lose my favourite person to a rocket.",
      "Wishing you a Diwali that is louder than the neighbours' crackers and sweeter than my fake promises to share the mithai."
    ]
  },
  short: {
    label: "Short & sweet",
    title: "happy  Deepavali, {to}",
    lines: [
      "ninna baduku yavagalu nagu nagutta hige erali ninna mele yara ketta drustiyu biladirali aa devaru yavaglu ninage kavalagiruttane  ninna future baal satoshadinda kudirali haagu ond advise nin yavudku tale kedsko beda swalp vichar madudu nilsu ",
      " and I am so lucky to have you as my best friend , sister,supporter ennu nang ellanu agidiya once again thank you so much for nin nann life olga erodakke and i love youuuuuuuuuuu  sooooooooo muchhh bangara🖤."
    ]
  }
};

/* =====================================================
   2. PAGE LOGIC (no need to edit)
   ===================================================== */
const params = new URLSearchParams(location.search);
const to = (params.get("to") || CONFIG.to).slice(0, 40);
const from = (params.get("from") || CONFIG.from).slice(0, 40);
let current = TEMPLATES[params.get("t")] ? params.get("t") : CONFIG.template;

const $ = id => document.getElementById(id);
const fill = s => s.replaceAll("{to}", to).replaceAll("{from}", from);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

document.title = `A Deepavali surprise for ${to}`;
$("introTitle").textContent = `Something small for you, ${to}`;

/* Diyas */
let lit = 0;
const total = CONFIG.diyaCount;
for (let i = 0; i < total; i++) {
  const b = document.createElement("button");
  b.className = "diya";
  b.type = "button";
  b.setAttribute("aria-label", `Light diya ${i + 1} of ${total}`);
  b.innerHTML = '<span class="glow"></span><span class="flame"></span><span class="wick"></span><span class="bowl"></span>';
  b.addEventListener("click", () => lightDiya(b));
  $("row").appendChild(b);
}

function lightDiya(el) {
  if (el.classList.contains("lit")) return;
  el.classList.add("lit");
  lit++;
  const r = el.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height * 0.4, 14, 60);
  if (navigator.vibrate) navigator.vibrate(15);
  $("hint").textContent = lit < total ? `Tap a diya. ${lit} of ${total} lit.` : "";
  if (lit === total) setTimeout(reveal, 700);
}

/* Message */
function renderMessage() {
  const t = TEMPLATES[current];
  $("cardTitle").textContent = fill(t.title);
  $("cardBody").innerHTML = "";
  t.lines.forEach(line => {
    const p = document.createElement("p");
    p.textContent = fill(line);
    $("cardBody").appendChild(p);
  });
  $("sign").textContent = `With love, ${from}`;
  const reply = `Thank you ${from}! Happy Deepavali  to you too! 🪔✨`;
  $("reply").href = "https://wa.me/?text=" + encodeURIComponent(reply);
  document.querySelectorAll("#tmpl button").forEach(btn =>
    btn.setAttribute("aria-pressed", String(btn.dataset.key === current)));
}

Object.entries(TEMPLATES).forEach(([key, t]) => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = t.label; b.dataset.key = key;
  b.addEventListener("click", () => { current = key; renderMessage(); });
  $("tmpl").appendChild(b);
});

function reveal() {
  $("intro").style.display = "none";
  $("hint").style.display = "none";
  $("row").style.margin = "0 0 26px";
  renderMessage();
  $("card").classList.add("show");
  $("tmpl").classList.add("on");
  finale();
}

/* Fireworks */
const cv = $("fx"), ctx = cv.getContext("2d");
let W, H, parts = [], running = false;
function resize() {
  const d = Math.min(devicePixelRatio || 1, 2);
  W = cv.width = innerWidth * d; H = cv.height = innerHeight * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener("resize", resize); resize();

const COLORS = ["#ffd36b", "#f5a623", "#d6336c", "#ff7a59", "#fff4dc", "#b388ff"];

function burst(x, y, n = 70, speed = 150) {
  if (reduced) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = speed * (.35 + Math.random() * .75);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1,
      decay: .5 + Math.random() * .6, c: COLORS[(Math.random() * COLORS.length) | 0], r: 1.5 + Math.random() * 1.8 });
  }
  if (!running) { running = true; last = performance.now(); requestAnimationFrame(tick); }
}

let last = 0;
function tick(now) {
  const dt = Math.min((now - last) / 1000, .05); last = now;
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  ctx.globalCompositeOperation = "lighter";
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) {
    p.vy += 120 * dt; p.vx *= .985; p.vy *= .985;
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= p.decay * dt;
    ctx.globalAlpha = Math.max(p.life, 0);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
  }
  if (parts.length) requestAnimationFrame(tick); else running = false;
}

function finale() {
  const shots = 7;
  for (let i = 0; i < shots; i++) {
    setTimeout(() => burst(innerWidth * (.15 + Math.random() * .7), innerHeight * (.15 + Math.random() * .35), 90, 190), i * 380);
  }
}
$("again").addEventListener("click", finale);
</script>
</body>
</html
